<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink | URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero-section { background: #007bff; color: white; padding: 60px 0; border-radius: 0 0 50px 50px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="hero-section text-center">
    <h1>QuickLink Shortener</h1>
    <p>Professional, Fast, and Reliable</p>
</div>

<div class="container" style="margin-top: -30px;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 mb-4">
                <form method="post">
                    <div class="input-group mb-3">
                        <input type="url" name="url" class="form-control form-control-lg" placeholder="Paste your long URL here..." required>
                        <button class="btn btn-dark btn-lg" type="submit">Shorten</button>
                    </div>
                </form>

                {% if short_url %}
                <div class="alert alert-success mt-3">
                    <strong>Success!</strong> Your short link is: 
                    <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
                </div>
                {% endif %}
            </div>

            <h4 class="mb-3">Recent Activity</h4>
            <div class="card p-3">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Original URL</th>
                            <th>Clicks</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in history %}
                        <tr>
                            <td class="text-truncate" style="max-width: 300px;">{{ item.original_url }}</td>
                            <td><span class="badge bg-primary">{{ item.clicks }}</span></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
