<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink | URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero-section { background: #007bff; color: white; padding: 60px 0; border-radius: 0 0 50px 50px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="hero-section text-center">
    <h1>QuickLink Shortener</h1>
    <p>Professional, Fast, and Reliable</p>
</div>

<div class="container" style="margin-top: -30px;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 mb-4">
                <form method="post">
                    <div class="input-group mb-3">
                        <input type="url" name="url" class="form-control form-control-lg" placeholder="Paste your long URL here..." required>
                        <button class="btn btn-dark btn-lg" type="submit">Shorten</button>
                    </div>
                </form>

                {% if short_url %}
                <div class="alert alert-success mt-4">
                    <h5 class="alert-heading mb-3">🎉 Success! Here is your short link:</h5>
                    <div class="input-group">
                        <input type="text" class="form-control form-control-lg bg-white" id="shortLinkInput" value="{{ short_url }}" readonly>
                        <button class="btn btn-success px-4" type="button" onclick="copyToClipboard(this)">Copy</button>
                    </div>
                </div>
                {% endif %}
            </div>

            <h4 class="mb-3">Recent Activity</h4>
            <div class="card p-3">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Original URL</th>
                            <th>Clicks</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in history %}
                        <tr>
                            <td class="text-truncate" style="max-width: 300px;">{{ item.original_url }}</td>
                            <td><span class="badge bg-primary">{{ item.clicks }}</span></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function copyToClipboard(buttonElement) {
        // Find the input box using its ID
        var copyText = document.getElementById("shortLinkInput");

        // Use the modern Navigator API to copy the text
        navigator.clipboard.writeText(copyText.value).then(function() {
            // Give the user visual feedback by changing the button text
            var originalText = buttonElement.innerHTML;
            buttonElement.innerHTML = "Copied! ✔️";
            buttonElement.classList.replace("btn-success", "btn-dark");

            // Change it back after 2 seconds
            setTimeout(function() {
                buttonElement.innerHTML = originalText;
                buttonElement.classList.replace("btn-dark", "btn-success");
            }, 2000);
        }).catch(function(err) {
            console.error('Failed to copy text: ', err);
        });
    }
</script>
</body>
</html>
